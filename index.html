function freshnessLabel(hoursAgo) {
  if (hoursAgo <= 6) return { text: `picked ${hoursAgo}h ago`, tone: "hot" };
  if (hoursAgo <= 14) return { text: `picked ${hoursAgo}h ago`, tone: "warm" };
  return { text: `picked ${hoursAgo}h ago`, tone: "cool" };
}


function App() {
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);

  const [cat, setCat] = useState("All");
  const [query, setQuery] = useState("");
  const [cart, setCart] = useState({});
  const [tab, setTab] = useState("shop");
  const [justAdded, setJustAdded] = useState({});
  const [address, setAddress] = useState({ name: "", phone: "", line1: "", landmark: "", pincode: "" });
  const [placing, setPlacing] = useState(false);
  const [placeError, setPlaceError] = useState(null);
  const [paymentMethod, setPaymentMethod] = useState("online");
  const [addressFound, setAddressFound] = useState(false);
  const [lookupPhone, setLookupPhone] = useState("");
  const [myOrders, setMyOrders] = useState(null);
  const [feedbackText, setFeedbackText] = useState("");
  const [feedbackSubmitting, setFeedbackSubmitting] = useState(false);
  const [feedbackSubmitted, setFeedbackSubmitted] = useState(false);
  const [feedbackError, setFeedbackError] = useState(null);
  const [ordersLoading, setOrdersLoading] = useState(false);
  const [ordersError, setOrdersError] = useState(null);

  const CATEGORY_ORDER = ["Vegetables", "Chinese", "Fruits"];

  // Load products from Supabase on first load
  useEffect(() => {
    (async () => {
      const { data, error } = await sb
        .from("products")
        .select("*")
        .eq("in_stock", true)
        .order("name", { ascending: true });
      if (error) {
        setLoadError(error.message);
      } else {
        const sorted = [...data].sort((a, b) => {
          const ai = CATEGORY_ORDER.indexOf(a.category);
          const bi = CATEGORY_ORDER.indexOf(b.category);
          return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
        });
        // add a stable "picked X hours ago" freshness value per item
        const withFreshness = sorted.map((p) => ({ ...p, picked: 3 + (p.id % 18) }));
        setProducts(withFreshness);
      }
      setLoading(false);
    })();
  }, []);

  const CATEGORIES = useMemo(() => {
    const cats = Array.from(new Set(products.map((p) => p.category)));
    cats.sort((a, b) => {
      const ai = CATEGORY_ORDER.indexOf(a);
      const bi = CATEGORY_ORDER.indexOf(b);
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
    });
    return ["All", ...cats];
  }, [products]);

  const filtered = useMemo(() => {
    return products.filter((p) => {
      const matchesCat = cat === "All" || p.category === cat;
      const matchesQuery = p.name.toLowerCase().includes(query.toLowerCase());
      return matchesCat && matchesQuery;
    });
  }, [products, cat, query]);

  const addOne = (id) => {
    setCart((c) => ({ ...c, [id]: (c[id] || 0) + 1 }));
    setJustAdded((j) => ({ ...j, [id]: true }));
    setTimeout(() => setJustAdded((j) => { const n = { ...j }; delete n[id]; return n; }), 500);
  };
  const removeOne = (id) => setCart((c) => {
    const n = (c[id] || 0) - 1;
    const next = { ...c };
    if (n <= 0) delete next[id]; else next[id] = n;
    return next;
  });

  const cartItems = Object.entries(cart).map(([id, qty]) => ({
    ...products.find((p) => String(p.id) === String(id)),
    qty,
  })).filter((p) => p.id !== undefined);
  const cartCount = cartItems.reduce((a, b) => a + b.qty, 0);
  const cartTotal = cartItems.reduce((a, b) => a + b.qty * b.price, 0);

  const saveOrder = async (paymentInfo) => {
    const { error } = await sb.from("orders").insert({
      customer_name: address.name,
      phone: address.phone,
      address_line: address.line1,
      landmark: address.landmark || null,
      pincode: address.pincode,
      items: cartItems.map((p) => ({ id: p.id, name: p.name, unit: p.unit, qty: p.qty, price: p.price })),
      total: cartTotal,
      razorpay_order_id: paymentInfo.razorpay_order_id || null,
      razorpay_payment_id: paymentInfo.razorpay_payment_id || null,
      payment_status: paymentInfo.payment_status,
    });
    if (error) {
      setPlaceError("Order could not be saved. Please try again or contact us: " + error.message);
      setPlacing(false);
      return;
    }
    setPlacing(false);
    setTab("confirmed");
  };

  const downloadReceipt = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 20;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.text("DadarMandi2Home", 14, y);
    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    y += 6;
    doc.text("Dadar Mandi, Mumbai", 14, y);
    y += 10;

    doc.setFont("helvetica", "bold");
    doc.text("Order Receipt", 14, y);
    y += 8;

    doc.setFont("helvetica", "normal");
    doc.text(`Name: ${address.name}`, 14, y); y += 6;
    doc.text(`Phone: ${address.phone}`, 14, y); y += 6;
    doc.text(`Address: ${address.line1}${address.landmark ? ", " + address.landmark : ""}, ${address.pincode}`, 14, y, { maxWidth: 180 }); y += 12;
    doc.text(`Payment: ${paymentMethod === "cod" ? "Cash on Delivery" : "Paid Online"}`, 14, y); y += 10;

    doc.setFont("helvetica", "bold");
    doc.text("Item", 14, y);
    doc.text("Qty", 120, y);
    doc.text("Price", 150, y);
    doc.text("Amount", 175, y);
    y += 4;
    doc.line(14, y, 196, y);
    y += 6;

    doc.setFont("helvetica", "normal");
    cartItems.forEach((p) => {
      doc.text(`${p.name} (${p.unit})`, 14, y, { maxWidth: 100 });
      doc.text(String(p.qty), 120, y);
      doc.text(`Rs ${p.price}`, 150, y);
      doc.text(`Rs ${p.qty * p.price}`, 175, y);
      y += 7;
    });

    y += 4;
    doc.line(14, y, 196, y);
    y += 8;
    doc.setFont("helvetica", "bold");
    doc.text(`Total: Rs ${cartTotal}`, 150, y);

    doc.save(`DadarMandi2Home_Order_Receipt.pdf`);
  };

  const lookupSavedAddress = async (phone) => {
    if (!phone || phone.length < 10) return;
    const { data } = await sb
      .from("orders")
      .select("customer_name, address_line, landmark, pincode")
      .eq("phone", phone)
      .order("created_at", { ascending: false })
      .limit(1)
      .maybeSingle();
    if (data) {
      setAddress((a) => ({
        ...a,
        name: a.name || data.customer_name,
        line1: a.line1 || data.address_line,
        landmark: a.landmark || data.landmark || "",
        pincode: a.pincode || data.pincode,
      }));
      setAddressFound(true);
    }
  };

  const findMyOrders = async () => {
    if (!lookupPhone || lookupPhone.length < 10) {
      setOrdersError("Please enter a valid 10-digit phone number.");
      return;
    }
    setOrdersLoading(true);
    setOrdersError(null);
    const { data, error } = await sb
      .from("orders")
      .select("*")
      .eq("phone", lookupPhone)
      .order("created_at", { ascending: false });
    setOrdersLoading(false);
    if (error) {
      setOrdersError("Could not fetch orders. Please try again.");
      return;
    }
    setMyOrders(data);
  };

  const submitFeedback = async () => {
    if (!feedbackText.trim()) return;
    setFeedbackSubmitting(true);
    setFeedbackError(null);
    const { error } = await sb.from("feedback").insert({ message: feedbackText.trim() });
    setFeedbackSubmitting(false);
    if (error) {
      setFeedbackError("Could not send this right now. Please try again.");
      return;
    }
    setFeedbackText("");
    setFeedbackSubmitted(true);
    setTimeout(() => setFeedbackSubmitted(false), 4000);
  };

  const orderAgain = (order) => {
    const newCart = {};
    order.items.forEach((it) => {
      newCart[it.id] = (newCart[it.id] || 0) + it.qty;
    });
    setCart(newCart);
    setAddress({
      name: order.customer_name,
      phone: order.phone,
      line1: order.address_line,
      landmark: order.landmark || "",
      pincode: order.pincode,
    });
    setAddressFound(true);
    setTab("basket");
  };

  const placeOrder = async () => {
    setPlacing(true);
    setPlaceError(null);

    if (paymentMethod === "cod") {
      await saveOrder({ payment_status: "cash_on_delivery" });
      return;
    }

    let orderData;
    try {
      const res = await fetch("/api/create-order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount: cartTotal }),
      });
      orderData = await res.json();
      if (!res.ok) throw new Error(orderData.error || "Could not start payment");
    } catch (err) {
      setPlaceError("Could not start payment: " + err.message);
      setPlacing(false);
      return;
    }

    const rzp = new Razorpay({
      key: RAZORPAY_KEY_ID,
      amount: orderData.amount,
      currency: orderData.currency,
      order_id: orderData.id,
      name: "DadarMandi2Home",
      description: `Order for ${cartCount} item${cartCount > 1 ? "s" : ""}`,
      prefill: { name: address.name, contact: address.phone },
      theme: { color: "#1B3B27" },
      handler: async (response) => {
        try {
          const verifyRes = await fetch("/api/verify-payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(response),
          });
          const verifyData = await verifyRes.json();
          if (!verifyData.verified) {
            setPlaceError("Payment could not be verified. If money was deducted, please contact us.");
            setPlacing(false);
            return;
          }
          await saveOrder({
            razorpay_order_id: response.razorpay_order_id,
            razorpay_payment_id: response.razorpay_payment_id,
            payment_status: "paid",
          });
        } catch (err) {
          setPlaceError("Something went wrong confirming your payment: " + err.message);
          setPlacing(false);
        }
      },
      modal: {
        ondismiss: () => setPlacing(false),
      },
    });
    rzp.on("payment.failed", () => {
      setPlaceError("Payment failed. Please try again.");
      setPlacing(false);
    });
    rzp.open();
  };

  return (
    <div className="h-screen w-full bg-[#E7E2D4] flex items-center justify-center p-2 overflow-auto">
      <div className="relative w-full max-w-[390px] h-full max-h-[820px] bg-[#F5F7EF] rounded-[2.5rem] shadow-2xl overflow-hidden border-[6px] border-[#1C2321] flex flex-col">

        {/* Header */}
        <div className="bg-[#1B3B27] px-5 pt-5 pb-4 rounded-b-3xl shadow-md relative z-10 shrink-0">
          <img src={BASKET_SRC} alt="Handpicked fresh vegetables" className="absolute top-3 right-3 w-20 h-[88px] object-cover rounded-lg shadow-lg" />
          <div className="flex items-center gap-2 min-w-0 mb-2 pr-24">
            <img src={LOGO_SRC} alt="DadarMandi2Home logo" className="w-20 h-20 rounded-full bg-white object-cover shrink-0" />
            <div className="leading-tight min-w-0">
              <div className="font-display text-[13px] text-[#F5F7EF] tracking-tight truncate">DadarMandi2Home</div>
              <div className="flex items-center gap-1 text-[#C7D6C4] min-w-0">
                <Icon.Map className="w-3 h-3 shrink-0" />
                <span className="text-[9.5px] tracking-wide truncate">Dadar Mandi · Mumbai</span>
              </div>
            </div>
          </div>
          <h1 className="font-display text-[10px] leading-tight text-[#F5F7EF] mb-3 whitespace-nowrap">
            Fresh from the mandi, <span className="text-[#C6F135]">before your breakfast.</span>
          </h1>
          <div className="flex items-center gap-2 bg-[#0F2718] rounded-xl px-3 py-2.5">
            <Icon.Search className="w-4 h-4 text-[#8FA998]" />
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search fruit, sabzi, herbs…"
              className="bg-transparent outline-none text-[13px] text-[#F5F7EF] placeholder-[#6B8A75] flex-1" />
          </div>
        </div>

        {/* Category pills */}
        {tab === "shop" && (
          <div className="flex gap-2 px-5 py-3 overflow-x-auto shrink-0">
            {CATEGORIES.map((c) => (
              <button key={c} onClick={() => setCat(c)}
                className={`whitespace-nowrap px-3.5 py-1.5 rounded-full text-[12.5px] font-medium border transition-colors ${
                  cat === c ? "bg-[#1B3B27] text-[#F5F7EF] border-[#1B3B27]" : "bg-transparent text-[#4B5A4E] border-[#C9D3C1]"
                }`}>{c}</button>
            ))}
          </div>
        )}

        {/* Product grid */}
        {tab === "shop" && (
          <div className="flex-1 overflow-y-auto px-5 pb-6">
            {loading ? (
              <p className="text-center pt-16 text-[#7C8B7E] text-[13px]">Loading fresh produce…</p>
            ) : loadError ? (
              <p className="text-center pt-16 text-[#B23A2E] text-[13px]">Couldn't load products: {loadError}</p>
            ) : filtered.length === 0 ? (
              <div className="text-center pt-16 text-[#7C8B7E]">
                <p className="font-display text-lg mb-1">Nothing in this bunch.</p>
                <p className="text-[13px]">Try another search or category.</p>
              </div>
            ) : (
              <div className="grid grid-cols-2 gap-2">
                {filtered.map((p) => {
                  const qty = cart[p.id] || 0;
                  const fresh = freshnessLabel(p.picked);
                  return (
                    <div key={p.id} className="bg-white rounded-xl p-2 border border-[#E5E7DE] flex flex-col">
                      <div className="flex items-start justify-between mb-0.5">
                        <div className="relative">
                          {p.image_url ? (
                            <img src={p.image_url} alt={p.name} className="w-9 h-9 rounded-md object-cover" />
                          ) : (
                            <div className="text-2xl">{p.emoji}</div>
                          )}
                          {qty > 0 && (
                            <span className="absolute -top-1 -right-2 bg-[#E4572E] text-white text-[8px] font-mono font-semibold rounded-full min-w-[14px] h-3.5 px-1 flex items-center justify-center">{qty}</span>
                          )}
                        </div>
                        <span className={`text-[8px] font-mono px-1 py-0.5 rounded-full ${
                          fresh.tone === "hot" ? "bg-[#EAF9CE] text-[#4C6B1F]" : fresh.tone === "warm" ? "bg-[#FFF1DE] text-[#8A5A1C]" : "bg-[#EFEFEF] text-[#6B6B6B]"
                        }`}>{fresh.text}</span>
                      </div>
                      <div className="text-[12px] font-semibold text-[#1C2321] leading-tight">{p.name}</div>
                      {p.marathi_name && <div className="text-[10px] text-[#4B5A4E] leading-tight">{p.marathi_name}</div>}
                      <div className="text-[10px] text-[#8B978C] mb-1">{p.unit}</div>
                      <div className="flex items-end gap-1.5 mb-1">
                        <span className="font-mono text-[13px] font-semibold text-[#1C2321]">₹{p.price}</span>
                      </div>
                      <div className="mt-auto">
                        <button onClick={() => addOne(p.id)}
                          className={`w-full py-1 rounded-md text-[11px] font-semibold transition-all duration-150 active:scale-95 ${
                            justAdded[p.id] ? "bg-[#1B3B27] text-[#C6F135] border border-[#1B3B27]" : "border border-[#1B3B27] text-[#1B3B27] hover:bg-[#1B3B27] hover:text-white"
                          }`}>{justAdded[p.id] ? "Added ✓" : "Add"}</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* Missing item feedback box */}
            <div className="mt-5 bg-white rounded-2xl p-4 border border-[#E5E7DE]">
              <p className="text-[13px] font-semibold text-[#1C2321] mb-1">Don't see something you're looking for?</p>
              <p className="text-[11px] text-[#8B978C] mb-2">Let us know if any vegetable, fruit, or Chinese item is missing from the list.</p>
              <textarea value={feedbackText} onChange={(e) => setFeedbackText(e.target.value)}
                placeholder="e.g. Please add drumsticks / shevga"
                rows={2}
                className="w-full bg-[#F0F3EB] rounded-lg px-3 py-2.5 text-[13px] outline-none text-[#1C2321] resize-none mb-2" />
              {feedbackError && <p className="text-[11px] text-[#B23A2E] mb-2">{feedbackError}</p>}
              {feedbackSubmitted ? (
                <p className="text-[12.5px] text-[#4C6B1F] font-semibold">✓ Thanks! We've noted this down.</p>
              ) : (
                <button onClick={submitFeedback} disabled={!feedbackText.trim() || feedbackSubmitting}
                  className="px-4 py-2 rounded-lg bg-[#1B3B27] text-white text-[12.5px] font-semibold disabled:opacity-40">
                  {feedbackSubmitting ? "Sending…" : "Submit"}
                </button>
              )}
            </div>
          </div>
        )}

        {/* Basket tab */}
        {tab === "basket" && (
          <div className="flex-1 overflow-y-auto px-5 py-4">
            <h2 className="font-display text-[20px] text-[#1C2321] mb-3">Your basket</h2>
            {cartItems.length === 0 ? (
              <div className="text-center pt-16 text-[#7C8B7E]">
                <Icon.Basket className="w-8 h-8 mx-auto mb-2 text-[#C9D3C1]" />
                <p className="font-display text-lg mb-1">Your basket is empty.</p>
                <p className="text-[13px] mb-4">Add some fresh produce to get started.</p>
                <button onClick={() => setTab("shop")} className="px-4 py-2 rounded-lg bg-[#1B3B27] text-white text-[12.5px] font-semibold">Browse produce</button>
              </div>
            ) : (
              <div className="flex flex-col gap-3">
                {cartItems.map((p) => (
                  <div key={p.id} className="flex items-center gap-3 border-b border-[#EEEFE9] pb-3">
                    {p.image_url ? (
                      <img src={p.image_url} alt={p.name} className="w-10 h-10 rounded-lg object-cover" />
                    ) : (
                      <div className="text-2xl">{p.emoji}</div>
                    )}
                    <div className="flex-1">
                      <div className="text-[13.5px] font-semibold text-[#1C2321]">{p.name}{p.marathi_name && <span className="text-[#4B5A4E] font-normal"> · {p.marathi_name}</span>}</div>
                      <div className="text-[11px] text-[#8B978C]">{p.unit} · ₹{p.price}</div>
                    </div>
                    <div className="flex items-center gap-2 bg-[#F0F3EB] rounded-lg px-1.5 py-1">
                      <button onClick={() => removeOne(p.id)}><Icon.Minus className="w-3.5 h-3.5 text-[#1B3B27]" /></button>
                      <span className="font-mono text-[12.5px] w-4 text-center">{p.qty}</span>
                      <button onClick={() => addOne(p.id)}><Icon.Plus className="w-3.5 h-3.5 text-[#1B3B27]" /></button>
                    </div>
                    <span className="font-mono text-[13px] font-semibold w-12 text-right">₹{p.qty * p.price}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* Total + Next (basket tab) */}
        {tab === "basket" && cartItems.length > 0 && (
          <div className="sticky bottom-0 px-5 py-4 bg-white border-t-2 border-[#1B3B27] shrink-0 z-30">
            <div className="flex items-center justify-between mb-3 text-[13px] text-[#4B5A4E]">
              <span>Total ({cartCount} item{cartCount > 1 ? "s" : ""})</span>
              <span className="font-mono text-[16px] font-semibold text-[#1C2321]">₹{cartTotal}</span>
            </div>
            <button onClick={() => setTab("address")}
              disabled={cartTotal < MIN_ORDER_AMOUNT}
              className="w-full bg-[#C6F135] text-[#1B3B27] rounded-xl py-3.5 text-[15px] font-bold shadow-lg border-2 border-[#1B3B27] disabled:opacity-40 disabled:shadow-none">
              {cartTotal < MIN_ORDER_AMOUNT ? `Add ₹${MIN_ORDER_AMOUNT - cartTotal} more to checkout` : "Next: Add address →"}
            </button>
            {cartTotal < MIN_ORDER_AMOUNT ? (
              <p className="text-[11px] text-[#B23A2E] text-center mt-2 leading-snug">
                Minimum order amount is ₹{MIN_ORDER_AMOUNT}. Please add a few more items to continue.
              </p>
            ) : (
              <p className="text-[11px] text-[#4B5A4E] text-center mt-2 leading-snug">
                Place your order today and receive it by 10:00 AM tomorrow. Need it urgently? Orders above ₹2,000 are eligible for delivery within 2 hours.
              </p>
            )}
          </div>
        )}

        {/* Address tab */}
        {tab === "address" && (
          <div className="flex-1 overflow-y-auto flex flex-col">
            <div className="px-5 pt-4 pb-2 flex items-center gap-2 shrink-0">
              <button onClick={() => setTab("basket")} className="text-[#1B3B27]"><Icon.Back className="w-5 h-5" /></button>
              <h2 className="font-display text-[19px] text-[#1C2321]">Delivery address</h2>
            </div>
            <div className="flex-1 px-5 py-2 flex flex-col gap-3">
              <div>
                <label className="text-[11px] text-[#8B978C] mb-1 block">Phone number</label>
                <input value={address.phone}
                  onChange={(e) => { setAddress((a) => ({ ...a, phone: e.target.value })); setAddressFound(false); }}
                  onBlur={(e) => lookupSavedAddress(e.target.value)}
                  placeholder="10-digit mobile number" className="w-full bg-[#F0F3EB] rounded-lg px-3 py-2.5 text-[13px] outline-none text-[#1C2321]" />
                {addressFound && (
                  <p className="text-[11px] text-[#4C6B1F] mt-1">✓ Welcome back! We've filled in your last saved address — edit if anything's changed.</p>
                )}
              </div>
              <div>
                <label className="text-[11px] text-[#8B978C] mb-1 block">Full name</label>
                <input value={address.name} onChange={(e) => setAddress((a) => ({ ...a, name: e.target.value }))}
                  placeholder="e.g. Priya Shah" className="w-full bg-[#F0F3EB] rounded-lg px-3 py-2.5 text-[13px] outline-none text-[#1C2321]" />
              </div>
              <div>
                <label className="text-[11px] text-[#8B978C] mb-1 block">Flat / House no., building, street</label>
                <textarea value={address.line1} onChange={(e) => setAddress((a) => ({ ...a, line1: e.target.value }))}
                  placeholder="e.g. 302, Shreeji Apartments, Ranade Road" rows={2}
                  className="w-full bg-[#F0F3EB] rounded-lg px-3 py-2.5 text-[13px] outline-none text-[#1C2321] resize-none" />
              </div>
              <div>
                <label className="text-[11px] text-[#8B978C] mb-1 block">Landmark (optional)</label>
                <input value={address.landmark} onChange={(e) => setAddress((a) => ({ ...a, landmark: e.target.value }))}
                  placeholder="e.g. Near Dadar Station" className="w-full bg-[#F0F3EB] rounded-lg px-3 py-2.5 text-[13px] outline-none text-[#1C2321]" />
              </div>
              <div>
                <label className="text-[11px] text-[#8B978C] mb-1 block">Pincode</label>
                <input value={address.pincode} onChange={(e) => setAddress((a) => ({ ...a, pincode: e.target.value }))}
                  placeholder="e.g. 400028" className="w-full bg-[#F0F3EB] rounded-lg px-3 py-2.5 text-[13px] outline-none text-[#1C2321]" />
              </div>
              {placeError && <p className="text-[12px] text-[#B23A2E]">{placeError}</p>}
            </div>
            <div className="sticky bottom-0 px-5 py-4 bg-white border-t-2 border-[#1B3B27] z-30">
              <div className="flex items-center justify-between mb-3 text-[13px] text-[#4B5A4E]">
                <span>Total ({cartCount} item{cartCount > 1 ? "s" : ""})</span>
                <span className="font-mono text-[16px] font-semibold text-[#1C2321]">₹{cartTotal}</span>
              </div>
              <div className="grid grid-cols-2 gap-2 mb-3">
                <button
                  onClick={() => setPaymentMethod("cod")}
                  className={`py-2.5 rounded-lg text-[12.5px] font-semibold border-2 ${
                    paymentMethod === "cod" ? "bg-[#1B3B27] text-white border-[#1B3B27]" : "bg-white text-[#1B3B27] border-[#C9D3C1]"
                  }`}>
                  Cash on Delivery
                </button>
                <button
                  onClick={() => setPaymentMethod("online")}
                  className={`py-2.5 rounded-lg text-[12.5px] font-semibold border-2 ${
                    paymentMethod === "online" ? "bg-[#1B3B27] text-white border-[#1B3B27]" : "bg-white text-[#1B3B27] border-[#C9D3C1]"
                  }`}>
                  Pay Now
                </button>
              </div>
              <button
                disabled={!address.name || !address.phone || !address.line1 || !address.pincode || placing}
                onClick={placeOrder}
                className="w-full bg-[#C6F135] text-[#1B3B27] rounded-xl py-3.5 text-[15px] font-bold shadow-lg border-2 border-[#1B3B27] disabled:opacity-40 disabled:shadow-none">
                {placing ? "Processing…" : paymentMethod === "cod" ? "Place Order (Cash on Delivery)" : `Pay ₹${cartTotal} & Place Order`}
              </button>
            </div>
          </div>
        )}

        {/* Confirmation */}
        {tab === "confirmed" && (
          <div className="flex-1 flex flex-col items-center justify-center px-8 text-center">
            <Icon.Check className="w-14 h-14 text-[#1B3B27] mb-4" />
            <h2 className="font-display text-[22px] text-[#1C2321] mb-2">Thank you for choosing DadarMandi2Home</h2>
            <p className="text-[13px] text-[#7C8B7E] mb-5">
              Delivering {cartCount} item{cartCount > 1 ? "s" : ""} worth ₹{cartTotal} to {address.name || "you"}.
            </p>
            <button onClick={downloadReceipt}
              className="px-5 py-2.5 rounded-lg border-2 border-[#1B3B27] text-[#1B3B27] text-[12.5px] font-semibold mb-3">
              📄 Click here to check your order (PDF)
            </button>
            <button onClick={() => { setCart({}); setAddress({ name: "", phone: "", line1: "", landmark: "", pincode: "" }); setTab("shop"); }}
              className="px-5 py-2.5 rounded-lg bg-[#1B3B27] text-white text-[12.5px] font-semibold">Back to shop</button>
          </div>
        )}

        {/* My Orders tab */}
        {tab === "myorders" && (
          <div className="flex-1 overflow-y-auto px-5 py-4">
            <h2 className="font-display text-[20px] text-[#1C2321] mb-3">My Orders</h2>
            <div className="flex gap-2 mb-4">
              <input value={lookupPhone} onChange={(e) => setLookupPhone(e.target.value)}
                placeholder="Enter your phone number"
                className="flex-1 bg-[#F0F3EB] rounded-lg px-3 py-2.5 text-[13px] outline-none text-[#1C2321]" />
              <button onClick={findMyOrders}
                className="px-4 py-2.5 rounded-lg bg-[#1B3B27] text-white text-[12.5px] font-semibold shrink-0">
                {ordersLoading ? "…" : "Find"}
              </button>
            </div>
            {ordersError && <p className="text-[12px] text-[#B23A2E] mb-3">{ordersError}</p>}
            {myOrders !== null && myOrders.length === 0 && (
              <p className="text-[13px] text-[#7C8B7E] text-center pt-8">No orders found for this number.</p>
            )}
            {myOrders && myOrders.length > 0 && (
              <div className="flex flex-col gap-3">
                {myOrders.map((o) => (
                  <div key={o.id} className="bg-white rounded-xl border border-[#E5E7DE] p-3">
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-[11px] text-[#8B978C]">{new Date(o.created_at).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })}</span>
                      <span className={`text-[9px] font-mono px-1.5 py-0.5 rounded-full ${o.payment_status === "paid" ? "bg-[#EAF9CE] text-[#4C6B1F]" : "bg-[#FFF1DE] text-[#8A5A1C]"}`}>
                        {o.payment_status === "paid" ? "Paid Online" : o.payment_status === "cash_on_delivery" ? "Cash on Delivery" : o.payment_status}
                      </span>
                    </div>
                    <div className="text-[12px] text-[#4B5A4E] mb-2">
                      {o.items.map((it) => `${it.name} x${it.qty}`).join(", ")}
                    </div>
                    <div className="flex items-center justify-between">
                      <span className="font-mono text-[14px] font-semibold text-[#1C2321]">₹{o.total}</span>
                      <button onClick={() => orderAgain(o)}
                        className="px-3 py-1.5 rounded-lg border-2 border-[#1B3B27] text-[#1B3B27] text-[11.5px] font-semibold">
                        Order Again
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* Bottom tab bar */}
        {(tab === "shop" || tab === "basket" || tab === "myorders") && (
          <div className="flex items-stretch border-t border-[#E5E7DE] bg-white shrink-0">
            <button onClick={() => setTab("shop")} className={`flex-1 flex flex-col items-center gap-0.5 py-2.5 text-[11px] font-medium ${tab === "shop" ? "text-[#1B3B27]" : "text-[#A9B3A6]"}`}>
              <Icon.Store className="w-5 h-5" />Shop
            </button>
            <button onClick={() => setTab("basket")} className={`relative flex-1 flex flex-col items-center gap-0.5 py-2.5 text-[11px] font-medium ${tab === "basket" ? "text-[#1B3B27]" : "text-[#A9B3A6]"}`}>
              <Icon.Basket className="w-5 h-5" />Basket
              {cartCount > 0 && <span className="absolute top-1 right-[calc(50%-18px)] bg-[#E4572E] text-white text-[9px] font-mono font-semibold rounded-full w-4 h-4 flex items-center justify-center">{cartCount}</span>}
            </button>
            <button onClick={() => setTab("myorders")} className={`flex-1 flex flex-col items-center gap-0.5 py-2.5 text-[11px] font-medium ${tab === "myorders" ? "text-[#1B3B27]" : "text-[#A9B3A6]"}`}>
              <Icon.Receipt className="w-5 h-5" />My Orders
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
